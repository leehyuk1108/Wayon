name = "wayon-cloud"
main = "src/worker.js"
compatibility_date = "2026-05-14"
workers_dev = true
preview_urls = true

[vars]
FCM_PROJECT_ID = "mycarserver-fb85e"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "wayon_cloud"
database_id = "c953a6c9-eb7a-4695-b1a4-702c5ede186d"

[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "f66d9a8906494da3a3a254e340d205ae"

[[durable_objects.bindings]]
name = "DEVICE_RELAY"
class_name = "WayonDeviceRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WayonDeviceRelay"]

[[vpc_services]]
binding = "WAYON_SERVER_API"
service_id = "019fad0d-99b9-7473-adf9-3abda60dfc8b"
remote = true

[[services]]
binding = "HEALTH_BRIDGE_API"
service = "health-bridge-api"
